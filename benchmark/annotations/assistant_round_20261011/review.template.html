.detail-scroll{flex:1;min-height:0;overflow:auto;padding:12px 18px 18px}.section-label{font-size:12px;color:#63716a;margin:0 0 6px;font-weight:500}.input-text{font-size:13.5px;line-height:1.7;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.input-text mark{background:#fff0b3;color:inherit;padding:1px 0;border-radius:2px}.source-cite{font-size:11.5px;color:#6b7572;margin:10px 0 0;line-height:1.5}.source-cite a{margin-left:6px}#source-note{font-size:12px;color:#7a4a0c;margin:6px 0 0;white-space:pre-wrap}#source-note:empty{display:none}

.human-review{border-top:1px solid #d5dbda;padding:10px 18px 12px;background:#fbfcfb}.review-options{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.review-options button{height:auto;min-height:34px;gap:5px;padding:4px 6px;font-size:12.5px;line-height:1.2}.review-options button[data-decision=accepted_no_location][aria-pressed=true]{background:#efeaf7;border-color:#6c4fa3;color:#53388a}.review-options button[data-decision=needs_changes][aria-pressed=true],.review-options button[data-decision=needs_evidence][aria-pressed=true]{background:#fff2dd;border-color:#a76a12;color:#754806}.review-options button[data-decision=rejected][aria-pressed=true]{background:#fcebee;border-color:#b54156;color:#953247}.review-options button[data-decision=modified_accepted][aria-pressed=true]{background:#e6f2fa;border-color:#126eaa;color:#125d8b}
#review-notes{display:block;width:100%;margin-top:8px;border:1px solid #cbd3ce;border-radius:4px;padding:6px 8px;font-size:13px;line-height:1.45;resize:vertical;min-height:40px;background:#fff;color:#252a2c}.review-actions{display:flex;gap:6px;margin-top:8px}.review-actions button{font-size:13px}.review-actions .primary{flex:1;background:#226a4c;color:#fff;border-color:#226a4c}.review-actions .primary:hover{background:#195b40}.review-summary{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}#review-message{font-size:11.5px;line-height:1.4;margin:0;color:#58665b;min-width:0;overflow-wrap:anywhere}#review-message[data-kind=error]{color:#a2213b}#review-message[data-kind=success]{color:#216a48}#review-progress{font-size:11.5px;white-space:nowrap;color:#5e6b62}#review-progress:not(:empty)::before{content:attr(data-prefix) " "}#live-review-link{display:block;margin-top:4px;font-size:12px}

@media(max-width:700px){header{height:auto;flex-wrap:wrap;padding:8px 12px;gap:6px 10px}#round-counts{order:3;flex-basis:100%}.workspace{display:flex;flex-direction:column;height:auto}.map-pane{height:70dvh;min-height:520px}.details{border-left:0;border-top:1px solid #d5dbda}.detail-scroll{overflow:visible}#map-filter{flex-basis:100%}.edit-toolbar{min-width:0;flex-wrap:wrap}#event-select,#review-filter,#status-filter,#screening-filter{flex:1 1 130px}.tool-row .divider{display:none}input[type=range]{width:70px}.review-options{grid-template-columns:repeat(2,1fr)}#source-passage{max-height:none}}

</head>
<body>
<header><h1><a href="/" title="Home / 主页">HE Grounding</a></h1><span id="round-counts"></span><label class="sr-only" for="language-select">界面语言 / Interface language</label><select id="language-select" title="界面语言 / Interface language"><option value="zh">中文</option><option value="en">English</option></select><label class="reviewer-box" for="reviewer">审核者<input id="reviewer" type="text" maxlength="100" autocomplete="name" disabled></label><a class="report" href="REPORT.md" title="Round report / 本轮说明"><i data-lucide="file-text"></i><span>说明</span></a></header>
<main class="workspace">
<section class="map-pane" aria-label="Event map">
<div class="filters">
<button class="icon" id="previous" title="上一题" aria-label="Previous event"><i data-lucide="chevron-left"></i></button>
<span id="position"></span>
<button class="icon" id="next" title="下一题" aria-label="Next event"><i data-lucide="chevron-right"></i></button>
<label class="sr-only" for="map-filter">Map</label><select id="map-filter"></select>
<label class="sr-only" for="event-select">Event</label><select id="event-select"></select>
<label class="sr-only" for="review-filter">Human review</label><select id="review-filter"><option value="all">审核：全部</option><option value="pending">未审核</option><option value="stale">待重审</option><option value="accepted">已接受</option><option value="modified_accepted">修改后接受</option><option value="accepted_no_location">确认图上没有</option><option value="needs_changes">需修改</option><option value="needs_evidence">待补证据</option><option value="rejected">剔除</option></select>
<label class="sr-only" for="status-filter">Status</label><select id="status-filter"><option value="all">候选：全部</option><option value="proposed">有候选</option><option value="ambiguous">有歧义</option><option value="source_conflict">史料冲突</option><option value="unreadable">地图不可读</option><option value="outside_map">不在图内</option></select>
<label class="sr-only" for="screening-filter">Screening advice</label><select id="screening-filter"><option value="all">筛查：全部</option></select>
</div>
<div class="tool-row">
<div class="toolbar">
<div class="view-mode" role="group" aria-label="Map layer"><button id="annotation-mode" aria-pressed="true">标注图</button><button id="reference-mode" aria-pressed="false">参考图</button></div>
<button class="icon" id="fit" title="适合窗口 / Fit map" aria-label="Fit map"><i data-lucide="maximize"></i></button>
<button class="icon" id="native" title="原始像素 / Original pixel scale" aria-label="Original pixel scale"><i data-lucide="scan"></i></button>
<button class="icon" id="focus" title="定位到候选 / Focus candidate" aria-label="Focus candidate"><i data-lucide="locate-fixed"></i></button>
<label class="sr-only" for="zoom">Zoom</label><input id="zoom" type="range" min="10" max="400" value="100"><output id="zoom-value" for="zoom">100%</output>
<label title="显示 AI 候选"><input id="show-overlay" type="checkbox" checked><span class="layer-swatch"></span>AI</label>
<label title="显示人工标注"><input id="show-human" type="checkbox" checked><span class="layer-swatch human"></span>人工</label>
</div>
<div class="toolbar edit-toolbar" aria-label="Geometry editor">
<span class="divider"></span>
<div class="mode-tools" role="group" aria-label="Editing mode">
<button class="icon" data-tool="pan" title="Pan / 平移" aria-label="Pan" aria-pressed="true"><i data-lucide="hand"></i></button>
<button class="icon" data-tool="edit" title="Move vertices; click an edge to add a vertex / 拖动顶点，点击边线插入顶点" aria-label="Edit vertices" aria-pressed="false" disabled><i data-lucide="mouse-pointer-2"></i></button>
<button class="icon" data-tool="point" title="New point / 新建点" aria-label="New point" aria-pressed="false" disabled><i data-lucide="map-pin"></i></button>
<button class="icon" data-tool="line" title="New line / 新建线" aria-label="New line" aria-pressed="false" disabled><i data-lucide="route"></i></button>
<button class="icon" data-tool="polygon" title="New polygon / 新建区域" aria-label="New polygon" aria-pressed="false" disabled><i data-lucide="pentagon"></i></button>
<button class="icon" data-tool="rect" title="New rectangle: drag across the map / 新建矩形：在图上拖出" aria-label="New rectangle" aria-pressed="false" disabled><i data-lucide="square"></i></button>
</div>
<button class="icon" id="finish-geometry" title="Finish drawing / 完成绘制" aria-label="Finish drawing" disabled><i data-lucide="check"></i></button>
<button class="icon" id="undo-geometry" title="Undo / 撤销" aria-label="Undo geometry" disabled><i data-lucide="undo-2"></i></button>
<button class="icon" id="redo-geometry" title="Redo / 重做" aria-label="Redo geometry" disabled><i data-lucide="redo-2"></i></button>
<button class="icon" id="delete-vertex" title="Delete selected vertex / 删除选中顶点" aria-label="Delete vertex" disabled><i data-lucide="minus"></i></button>
<button class="icon" id="clear-geometry" title="Clear geometry / 清空标注" aria-label="Clear geometry" disabled><i data-lucide="eraser"></i></button>
<button class="icon" id="to-box" title="Turn into a horizontal box around it / 转成外接水平矩形" aria-label="Convert to box" disabled><i data-lucide="square-dashed"></i></button>
<button class="icon" id="restore-candidate" title="Restore original AI candidate / 恢复原始候选" aria-label="Restore AI candidate" disabled><i data-lucide="rotate-ccw"></i></button>
<span id="editor-state" class="editor-state" role="status"></span>
</div>
</div>
<div class="viewport" id="viewport"><div id="stage"><img id="map-image" alt="Historical map" draggable="false"><canvas id="overlay"></canvas></div><div id="map-note"></div></div>
</section>
<aside class="details" aria-label="Annotation evidence">
<div id="empty" class="hidden">没有符合筛选条件的题目。</div>
<div id="event-detail">
<div class="detail-head">
<div class="event-heading"><h2 id="event-title"></h2><span id="event-status" class="badge"></span></div>
<p id="question"></p>
<div class="candidate"><span class="k">AI 候选</span><span id="location"></span><span id="caveat"></span></div>
</div>
<div class="detail-scroll" id="detail-scroll">
<p class="section-label">模型看到的原文</p>
<p id="input-text" class="input-text"></p>
<p id="source-cite" class="source-cite"></p>
<p id="source-note"></p>
<details class="more" id="more-info"><summary>更多信息（AI 依据、筛查、对照、元数据）</summary>
<h3>AI 文本依据</h3><p id="text-evidence"></p>
<h3>AI 地图依据</h3><p id="map-evidence"></p>
<div class="metrics"><span id="confidence"></span><span id="geometry-type"></span></div>
<section id="source-review" class="hidden" aria-label="Source text check">
<h3>筛查</h3>
<div id="screening" class="screening"><span id="screening-advice" class="badge"></span><p id="screening-issue"></p></div>
<div id="rewrite-box" class="hidden"><h3>建议改写的问题</h3><p id="rewrite-question"></p></div>
<h3 id="compare-heading">对照</h3>
<div class="text-views" role="group" aria-label="Text version"><button data-view="original" aria-pressed="false">原文语言</button><button data-view="ai" aria-pressed="false">旧 AI 改写</button></div>
<p id="source-passage"></p>
</section>
<h3>史料与来源信息</h3><p id="original-text" class="hidden"></p><dl id="source-meta"></dl><div class="source-links"><a id="text-link" target="_blank" rel="noopener noreferrer">文本来源</a><a id="map-link" target="_blank" rel="noopener noreferrer">地图来源</a></div>
<h3>坐标与版本</h3><p id="map-version"></p><dl id="coordinate-meta"></dl><p><code id="coordinates"></code></p>
</details>
</div>
<section class="human-review" aria-label="Human review">
<div class="review-options" role="group" aria-label="Review decision">
<button type="button" data-decision="accepted" aria-pressed="false" title="Accept / 接受" disabled><i data-lucide="check"></i><span>接受</span></button>
<button type="button" data-decision="modified_accepted" aria-pressed="false" title="Modified &amp; accepted: edit the geometry on the map first / 修改后接受：先在地图上改几何" disabled><i data-lucide="check-check"></i><span>改后接受</span></button>
<button type="button" data-decision="accepted_no_location" aria-pressed="false" title="Not on map: the asked location is not on this map, kept as an abstention item; clear any candidate geometry first / 图上没有：这张图上没有所问的位置，留作拒答题；有候选几何时先清空" disabled><i data-lucide="map-pin-off"></i><span>图上没有</span></button>
<button type="button" data-decision="needs_changes" aria-pressed="false" title="Needs changes / 需修改" disabled><i data-lucide="square-pen"></i><span>需修改</span></button>
<button type="button" data-decision="needs_evidence" aria-pressed="false" title="Needs evidence / 待补证据" disabled><i data-lucide="circle-help"></i><span>待补证据</span></button>
<button type="button" data-decision="rejected" aria-pressed="false" title="Reject / 剔除" disabled><i data-lucide="ban"></i><span>剔除</span></button>
</div>
<label class="sr-only" for="review-notes">Notes</label><textarea id="review-notes" rows="2" maxlength="10000" placeholder="备注：修改要求或理由（除“接受”外必填）" disabled></textarea>
<div class="review-actions"><button id="review-save-next" class="primary" disabled><i data-lucide="arrow-right"></i>保存并下一题</button><button id="review-save" disabled><i data-lucide="save"></i>保存</button><button class="icon" id="review-reset" title="Reset to pending / 恢复未审核" aria-label="Reset to pending" disabled><i data-lucide="rotate-ccw"></i></button><button class="icon" id="review-reload" title="Reload saved reviews / 重新读取审核" aria-label="Reload saved reviews" disabled><i data-lucide="refresh-cw"></i></button></div>
<div class="review-summary"><p id="review-message" role="status" aria-live="polite">连接中…</p><span id="review-progress"></span></div>
<a id="live-review-link" class="hidden" href="http://127.0.0.1:8771/review.html">Open review workspace / 打开审核工作台</a>
</section>
</div>
</aside>
</main>
<script id="round-data" type="application/json">__ROUND_DATA__</script>

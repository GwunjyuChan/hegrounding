<!doctype html>
<html lang="zh-CN">
<head>
  <base href="/">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HE · 地名实验</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="atlas.css"><link rel="stylesheet" href="place-lab.css">
  <link rel="stylesheet" href="i18n.css"><script defer src="i18n.js"></script><script defer src="vendor/leaflet.js"></script><script defer src="vendor/lucide.js"></script><script defer src="workspace-url.js"></script><script defer src="atlas-api.js"></script><script defer src="session-ui.js"></script><script defer src="place-lab.js"></script>
</head>
<body class="atlas-app place-lab">
  <header class="app-header"><a id="lab-home" class="brand" href="/" aria-label="返回平台首页"><span class="brand-mark">HE</span></a><h1>地名实验</h1><span id="lab-dirty" aria-live="polite"></span><button id="lab-refresh" class="icon-button" aria-label="刷新" title="刷新"><i data-lucide="refresh-cw"></i></button></header>
  <main class="lab-layout">
    <aside class="lab-nav"><div class="field"><label for="lab-map">实验地图</label><select id="lab-map"></select></div><button id="lab-upload-open" class="secondary full"><i data-lucide="upload"></i>上传实验地图</button><h2>地名 <span id="lab-count"></span></h2><div id="lab-tasks"></div></aside>
    <section class="lab-center">
      <div class="pane-heading"><h2 id="lab-title">选择地名</h2><span id="lab-dimensions" class="mono"></span><button id="lab-fit" class="icon-button" title="全图" aria-label="全图"><i data-lucide="scan"></i></button></div>
      <div class="canvas-wrap"><div id="lab-canvas" aria-label="地名实验地图"></div><div id="lab-empty">未设置底图</div><div class="atlas-toolbar" role="toolbar" aria-label="地名标注工具"><button id="lab-hand" class="icon-button active" title="平移" aria-label="平移"><i data-lucide="hand"></i></button><button id="lab-point" class="icon-button" title="地名文字中心点" aria-label="地名文字中心点"><i data-lucide="map-pin"></i></button><button id="lab-polygon" class="icon-button" title="地名文字区域" aria-label="地名文字区域"><i data-lucide="pentagon"></i></button><button id="lab-undo" class="icon-button" title="撤销" aria-label="撤销"><i data-lucide="undo-2"></i></button><button id="lab-redo" class="icon-button" title="重做" aria-label="重做"><i data-lucide="redo-2"></i></button><button id="lab-clear" class="icon-button" title="清空人工几何" aria-label="清空人工几何"><i data-lucide="trash-2"></i></button></div></div>
      <div class="pane-footer"><span id="lab-version"></span><span id="lab-cursor"></span></div>
      <div class="atlas-bottom"><label><input id="lab-show-gold" type="checkbox" checked><span class="legend-gold">人工标注</span></label><label><input id="lab-show-model" type="checkbox" checked><span class="legend-prediction">模型预测</span></label><span id="lab-metric"></span></div>
    </section>
    <aside class="lab-inspector">
      <h2>地名文字定位</h2>
      <form id="lab-add-form"><div class="field"><label for="lab-name">地名</label><input id="lab-name" maxlength="160" autocomplete="off" required></div><button id="lab-add" class="secondary full" type="submit"><i data-lucide="plus"></i>新增地名</button></form>
      <section id="lab-annotation"><h2>人工答案</h2><div class="field"><label for="lab-status">审核状态</label><select id="lab-status"><option value="accepted">通过</option><option value="ambiguous">有歧义</option><option value="unlocatable">无法定位</option></select></div><div class="form-row"><div class="field"><label for="lab-confidence">置信度</label><select id="lab-confidence"><option value="">未审核</option><option value="1">1 · 非常不确定</option><option value="2">2 · 不确定</option><option value="3">3 · 尚可</option><option value="4">4 · 较有把握</option><option value="5">5 · 非常有把握</option></select></div><div class="field"><label for="lab-tolerance">点容差 px</label><input id="lab-tolerance" type="number" min="0" value="0"></div></div><div class="field"><label for="lab-evidence">标注备注</label><textarea id="lab-evidence" rows="2" maxlength="4000"></textarea></div><div class="field"><label for="lab-annotator">标注者</label><input id="lab-annotator" value="eric" maxlength="100"></div><button id="lab-save" class="primary full"><i data-lucide="save"></i>保存人工答案</button></section>
      <section><h2>预测结果</h2><div id="lab-model" class="muted">Qwen3-VL-8B · 本地</div><div id="lab-job" role="status" aria-live="polite"></div><div class="field"><label for="lab-runs">预测批次</label><select id="lab-runs"></select></div><div id="lab-summary" role="status"></div><div id="lab-result"></div><button id="lab-export" class="secondary full"><i data-lucide="download"></i>导出整图实验 JSON</button></section>
      <section><h2>批量预测文件</h2><button id="lab-input" class="secondary full"><i data-lucide="download"></i>导出预测输入包</button><div class="field"><label for="lab-prediction-file">模型结果 JSON</label><input id="lab-prediction-file" type="file" accept=".json,application/json"></div><button id="lab-import" class="secondary full"><i data-lucide="upload"></i>导入预测结果</button></section>
      <div id="lab-error" role="alert"></div>
    </aside>
  </main>
  <dialog id="lab-confirm"><h2>未保存的修改</h2><p>离开会丢弃当前草稿。</p><div class="dialog-actions"><button id="lab-cancel" class="secondary">取消</button><button id="lab-continue" class="primary">继续</button></div></dialog>
  <dialog id="lab-upload-dialog"><form id="lab-upload-form"><div class="upload-heading"><h2>上传实验地图</h2><button id="lab-upload-cancel" type="button" class="icon-button" aria-label="取消上传" title="取消上传"><i data-lucide="x"></i></button></div><div class="field"><label for="lab-map-title">地图名称</label><input id="lab-map-title" maxlength="200" required></div><div class="field"><label for="lab-map-file">地图文件</label><input id="lab-map-file" type="file" accept="image/png,image/jpeg,image/tiff,image/webp,image/gif,application/pdf" required></div><div class="field"><label for="lab-map-page">PDF 页码（含封面）</label><input id="lab-map-page" type="number" min="1" max="1000" value="1"></div><button id="lab-upload-submit" type="submit" class="primary full">上传并开始标注</button><p id="lab-upload-error" role="alert"></p></form></dialog>
</body></html>
